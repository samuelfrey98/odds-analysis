name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Run tests against installed package
        run: python -m unittest discover -s tests -v
      - name: Exercise installed CLI
        run: odds-analysis examples/synthetic_quotes.csv --as-of 2030-01-15T12:05:00Z --format json --output reports/demo.json
      - name: Import saved snapshot and analyze normalized quotes
        run: |
          odds-analysis import-snapshot examples/saved_event_odds.json --mapping examples/snapshot_mapping.json --captured-at 2030-01-15T12:05:00Z --odds-format american --output reports/imported.csv
          odds-analysis reports/imported.csv --as-of 2030-01-15T12:05:00Z --format json --output reports/imported-analysis.json
      - name: Exercise multi-book consensus CLI
        run: odds-analysis examples/consensus_quotes.csv --as-of 2030-01-15T12:05:00Z --reference-book 'Reference A' --reference-book 'Reference B' --reference-book 'Reference C' --format json --output reports/consensus.json
      - name: Run self-contained simulation outside the checkout
        working-directory: ${{ runner.temp }}
        run: odds-analysis demo --output odds-analysis-demo
