[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "odds-analysis"
version = "0.5.0"
description = "Explainable player-prop odds analysis with reproducible simulation and manual capture"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Samuel Frey"}]
keywords = ["odds", "market-data", "simulation", "data-validation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.scripts]
odds-analysis = "odds_analysis.cli:main"

[project.urls]
Repository = "https://github.com/samuelfrey98/odds-analysis"
Documentation = "https://github.com/samuelfrey98/odds-analysis#readme"
Issues = "https://github.com/samuelfrey98/odds-analysis/issues"
Changelog = "https://github.com/samuelfrey98/odds-analysis/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
