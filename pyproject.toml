[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odds-analysis"
version = "0.3.0"
description = "Reproducible, offline analysis of player-prop market snapshots"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.scripts]
odds-analysis = "odds_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
